<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <!-- Полный экран на телефоне при «Добавить на домашний экран»: только так
         iPhone Safari прячет свои панели (программного Fullscreen там нет). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Паук" />
    <meta name="theme-color" content="#0d1512" />
    <title>Cozy Spider · пасьянс «Паук»</title>
    <!-- Без description поисковик берёт в сниппет единственный текст
         страницы — «тасуем колоду…» из заставки. -->
    <meta name="description" content="Пасьянс «Паук» в браузере: одна, две или четыре масти, отмена ходов, подсказки. Без рекламы и регистрации, открыли и играете. Стол у ночного пруда, рядом лампа и кот." />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- 120×120 — размер, который просит Яндекс для выдачи -->
    <link rel="icon" type="image/png" sizes="120x120" href="/icon-120.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --ink: #e6f0e6;
        --ink-dim: #93a99b;
        --panel: rgba(12, 24, 20, 0.62);
        --edge: rgba(216, 201, 160, 0.16);
        --edge-strong: rgba(216, 201, 160, 0.42);
      }

      html, body {
        margin: 0;
        height: 100%;
        background: #0d1512;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      #stage { position: fixed; inset: 0; touch-action: none; }

      /* Заставка. Живёт прямо в HTML, чтобы появиться до загрузки JS:
         после «Применить» страница перезагружается, и без неё игрок
         смотрел бы в чёрный экран все секунды, пока едут слои сцены. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0d1512;
        transition: opacity 0.5s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .bar {
        width: min(240px, 60vw);
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(216, 201, 160, 0.14);
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: #d8c9a0;
        transition: width 0.25s ease;
      }
      /* Пока манифесты не прочитаны, прогресса ещё нет — полоска ходит
         сама, чтобы страница не выглядела зависшей. */
      #boot.idle .bar i {
        width: 30%;
        animation: boot-slide 1.3s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }
      #boot span {
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--ink-dim);
      }

      /* HUD живёт над канвасом и намеренно не попадает в пост-обработку:
         зерно и виньетка на цифрах читаются как грязь, а не как атмосфера. */
      #hud {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      .hud-bar {
        position: absolute;
        left: 0; right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        box-sizing: border-box;
        flex-wrap: wrap;
        /* Ровно «normal» для Georgia: (1878 + 449) / 2048 по таблице hhea.
           На Android Georgia нет, подставляется Noto Serif, а у неё normal —
           1.36: каждая кнопка вырастала на 3 px, и панель из трёх рядов
           наезжала на верх колонок на 10 px. Явное число держит HUD одной
           высоты на любом шрифте; на iOS панель сдвигается меньше чем на 1 px.
           Только панель, не вся страница: у строк со значками, которых в
           Georgia нет (✕ ✓ ↗ ₽), «normal» берётся от запасного шрифта, и
           число на body укорачивало бы на iOS эти кнопки. */
        line-height: 1.136;
      }
      .hud-top { top: 0; }

      .hud-group {
        display: flex;
        align-items: center;
        /* Перенос обязателен: на телефоне в портрете шесть кнопок в одну
           строку не влезают, и «Меню» уезжало за правый край экрана —
           титульник, профиль и вход становились недоступны. min-width:0
           разрешает группе сжаться уже вьюпорта, иначе перенос не начнётся. */
        flex-wrap: wrap;
        min-width: 0;
        gap: 8px;
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 12px;
        padding: 6px 10px;
        backdrop-filter: blur(8px);
      }

      .hud-title {
        font-size: 22px;
        letter-spacing: 0.04em;
        padding-right: 4px;
      }

      /* Широкая панель, которой тесно в один ряд (ставит main.ts, только
         когда плашки уже разъехались на два ряда). Телефон на боку — 800–850 px,
         ряд с Georgia просит ~837, а на Android Georgia нет: Noto Serif шире,
         просит ~874, и кнопки уезжали во второй ряд, отъедая высоту у стола.
         Ужимаем воздух, а не кегль: ~120 px запаса. iPhone 844+ сюда не
         попадает вовсе; iPhone 812/736 на боку и iPad в портрете попадают —
         там панель с Georgia тоже переносилась и закрывала верх колонок. */
      @media (min-width: 721px) {
        .hud-bar.hud-tight { padding-left: 8px; padding-right: 8px; gap: 8px; }
        .hud-tight .hud-group { padding-left: 6px; padding-right: 6px; gap: 5px; }
        .hud-tight .hud-title { padding-right: 0; }
        .hud-tight button,
        .hud-tight .hud-seg button { padding-left: 7px; padding-right: 7px; }
      }

      .hud-suits {
        font-size: 14px;
        color: var(--ink-dim);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Сегментный переключатель вместо нативного селекта: системный
         дропдаун с синей подсветкой ломал стиль сцены. */
      .hud-seg {
        display: flex;
        gap: 3px;
      }
      .hud-seg button {
        padding: 4px 10px;
        font-size: 14px;
        border-radius: 7px;
        color: var(--ink-dim);
      }
      .hud-seg button.on {
        color: var(--ink);
        background: rgba(216, 201, 160, 0.18);
        border-color: rgba(216, 201, 160, 0.42);
      }

      /* Кегли на ступень крупнее исходных: «на моём экране не видно»
         (фидбек тестеров). */
      button {
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 6px 11px;
        cursor: pointer;
        transition: background 140ms ease, opacity 140ms ease;
      }
      button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.13); }
      button:disabled { opacity: 0.35; cursor: default; }

      .hud-toast {
        position: absolute;
        left: 50%;
        top: 96px;
        transform: translate(-50%, -8px);
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--edge);
        backdrop-filter: blur(8px);
        font-size: 18px;
        opacity: 0;
        transition: opacity 220ms ease, transform 220ms ease;
      }
      .hud-toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* Лавка. Тот же язык, что у HUD: полупрозрачные панели, тёплый кант. */
      .shop-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 12, 10, 0.55);
        backdrop-filter: blur(3px);
        pointer-events: auto;
      }
      .shop-overlay.show { display: flex; }
      /* Профиль и почта открываются С титульника (z 30) — им выше. */
      .shop-overlay.over-start { z-index: 40; }

      .shop-panel {
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 64px);
        overflow-y: auto;
        background: rgba(14, 26, 22, 0.92);
        border: 1px solid var(--edge);
        border-radius: 16px;
        padding: 18px 20px;
        box-sizing: border-box;
      }

      .shop-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }
      .shop-title { font-size: 21px; letter-spacing: 0.04em; }
      .shop-close { position: absolute; right: 0; padding: 4px 10px; }

      /* Ряды «сцена — парная колода»: пара в одном ряду сетки, поэтому
         стоит строго напротив, а карточки ряда тянутся до одной высоты. */
      .shop-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px;
        align-items: stretch;
      }
      .shop-col-head {
        margin: 0 2px 1px;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      @media (max-width: 480px) {
        /* Одна колонка: пары идут подряд — сцена, под ней её колода. */
        .shop-list { grid-template-columns: 1fr; }
        .shop-col-head, .shop-gap { display: none; }
      }

      .shop-card {
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--edge);
        border-radius: 12px;
        overflow: hidden;
      }
      /* «Сейчас в игре» — тёплый кант вместо слова. */
      .shop-active {
        border-color: var(--edge-strong);
        box-shadow: inset 0 0 0 1px var(--edge-strong), 0 0 22px rgba(216, 201, 160, 0.1);
      }

      /* Миниатюра-витрина: у сцены — баннер, у колоды — веер настоящих карт. */
      .shop-thumb {
        position: relative;
        height: 168px;
        overflow: hidden;
        background: radial-gradient(120% 120% at 70% 20%, #22332b, #0e1613);
      }
      .shop-scene {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
        transition: transform 0.35s ease;
      }
      /* Миниатюру можно тапнуть — крупный просмотр. Ненавязчивая подсказка. */
      .shop-thumb-tap { cursor: pointer; }
      .shop-thumb-tap:hover .shop-scene { transform: scale(1.03); }
      .shop-thumb-tap:hover .shop-peek { background: rgba(8, 16, 13, 0.72); border-color: var(--edge-strong); }
      .shop-fan {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shop-fan img {
        position: absolute;
        width: 70px;
        aspect-ratio: 512 / 742;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        background: #1a2620;
      }
      /* Значки поверх миниатюры — визуальные, вместо текстовых бейджей. */
      .shop-medallion {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(169, 199, 178, 0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      .shop-medallion svg {
        width: 15px;
        height: 15px;
        stroke: #0d1512;
        stroke-width: 2.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .shop-peek {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 50%;
        background: rgba(8, 16, 13, 0.5);
        border: 1px solid var(--edge);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      .shop-peek svg {
        width: 15px;
        height: 15px;
        stroke: var(--ink);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
      }
      .shop-peek:hover { background: rgba(8, 16, 13, 0.72); border-color: var(--edge-strong); }
      .shop-pricetag {
        position: absolute;
        left: 10px;
        bottom: 10px;
        font-size: 14px;
        color: #f0e7cf;
        background: rgba(8, 16, 13, 0.58);
        border: 1px solid var(--edge);
        border-radius: 20px;
        padding: 3px 12px;
        backdrop-filter: blur(4px);
      }

      .shop-body {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 12px 13px 13px;
        flex: 1;
      }
      .shop-body b { font-size: 16px; }
      /* Место под кнопку зарезервировано всегда — высота карточки не «прыгает»
         от наличия «Применить»/«Купить» (у активного пака кнопки нет). */
      .shop-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; min-height: 36px; }
      .shop-buy {
        color: #f0e7cf;
        background: rgba(216, 201, 160, 0.18);
        border-color: var(--edge-strong);
      }
      .shop-buy:hover:not(:disabled) { background: rgba(216, 201, 160, 0.28); }
      /* Триал: вместо ценника — тихая подпись-подарок, тёплая зелень
         вместо золота цены. Без таймера. */
      .shop-pricetag.shop-price-trial { color: #a9c7b2; font-size: 12px; letter-spacing: 0.02em; }
      /* Набор: во всю ширину над рядами, в миниатюре его паки плитками,
         на ценнике зачёркнута сумма по отдельности. */
      .shop-bundle { grid-column: 1 / -1; }
      .shop-bundle-thumb { display: flex; gap: 2px; height: 140px; }
      /* isolation: z-index карт веера остаётся внутри плитки, иначе на узком
         экране соседний веер ложится поверх ценника набора. */
      .shop-bundle-tile { position: relative; flex: 1; min-width: 0; overflow: hidden; isolation: isolate; }
      .shop-bundle-tile .shop-fan img { width: 56px; }
      .shop-bundle-parts { font-size: 13px; color: var(--ink-dim); }
      .shop-pricetag s { opacity: 0.55; margin-right: 4px; }
      .shop-card .shop-noted { opacity: 1; color: #a9c7b2; }
      /* «Оставить · цена» на триале: тихая вторичная кнопка рядом с «Применить».
         Пак и так открыт сегодня — путь купить виден, но не давит. Живёт в
         строке .shop-actions, поэтому без align-self и своих отступов сверху. */
      .shop-keep-btn {
        padding: 4px 2px;
        background: transparent;
        border-color: transparent;
        color: var(--ink-dim);
        font-size: 12px;
        letter-spacing: 0.03em;
      }
      .shop-keep-btn:hover:not(:disabled) { background: transparent; color: #d8c9a0; }

      .shop-note {
        margin-top: 14px;
        font-size: 11px;
        color: var(--ink-dim);
        text-align: center;
      }
      .shop-note a { color: inherit; }
      .shop-note a:hover { color: var(--ink); }

      /* «Посмотреть колоду»: вторичная, тихая кнопка под основным действием. */
      .shop-preview-btn {
        padding: 4px 2px;
        background: transparent;
        border-color: transparent;
        color: var(--ink-dim);
        font-size: 12px;
        letter-spacing: 0.03em;
      }
      .shop-preview-btn::after { content: " ↗"; opacity: 0.7; }
      .shop-preview-btn:hover:not(:disabled) { background: transparent; color: #d8c9a0; }

      /* Лайтбокс витрины: картинка колоды поверх лавки. */
      .shop-lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(4, 8, 7, 0.82);
        backdrop-filter: blur(4px);
        opacity: 0;
        transition: opacity 180ms ease;
        cursor: zoom-out;
        /* #hud выключает клики (pointer-events:none) — вернуть их, иначе
           мышь проваливается сквозь лайтбокс на титульник под ним. */
        pointer-events: auto;
      }
      .shop-lightbox.show { opacity: 1; }
      .shop-lightbox-fig {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        cursor: default;
      }
      /* Раскрытие колоды: карты выкладываются по одной и «распахиваются». */
      .shop-lightbox-cards {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        width: min(760px, 92vw);
        perspective: 1400px;
      }
      .shop-lb-card {
        width: 100%;
        aspect-ratio: 512 / 742;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--edge);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
        background: #182420;
        opacity: 0;
        transform: rotateY(-78deg) translateY(10px);
        transform-origin: left center;
        transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.2, 0.8, 0.25, 1);
      }
      .shop-lightbox.show .shop-lb-card { opacity: 1; transform: none; }
      @media (prefers-reduced-motion: reduce) {
        .shop-lb-card { transition-duration: 0.01ms; transition-delay: 0ms !important; }
      }
      /* Одиночная картинка (крупная сцена): без сетки, строго по центру. */
      .shop-lightbox-solo {
        display: flex;
        width: auto;
        justify-content: center;
        perspective: none;
      }
      .shop-lb-single {
        display: block;
        max-width: min(94vw, 1120px);
        max-height: 84vh;
        border-radius: 12px;
        border: 1px solid var(--edge);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      @media (max-width: 620px) {
        .shop-lightbox-cards { grid-template-columns: repeat(4, 1fr); width: min(420px, 92vw); }
      }
      .shop-lightbox-fig figcaption {
        font-size: 14px;
        letter-spacing: 0.05em;
        color: var(--ink-dim);
      }
      .shop-lightbox-close {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 6px 12px;
        font-size: 16px;
      }

      /* Титульный экран. Сцена живёт позади и просвечивает: она и есть
         заставка. Панель — тот же язык, что HUD и лавка. */
      /* Тёплая вспышка в момент веера карт: чистый CSS, ломаться нечему. */
      .win-flash {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background: radial-gradient(ellipse at 50% 42%,
          rgba(255, 214, 140, 0.55), rgba(255, 214, 140, 0.18) 45%, transparent 75%);
        animation: win-flash 2.5s ease-out forwards;
      }
      @keyframes win-flash {
        0% { opacity: 0; }
        22% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Плашка победы: поверх финального эффекта, в стиле стартовой панели. */
      .win-plaque {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%) scale(0.94);
        z-index: 30;
        padding: 22px 34px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 16px;
        backdrop-filter: blur(6px);
        opacity: 0;
        transition: opacity 0.45s ease, transform 0.45s ease;
        pointer-events: none;
      }
      .win-plaque.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: auto;
      }
      .win-plaque-title { font-size: 30px; letter-spacing: 0.05em; }
      .win-plaque-sub {
        font-size: 13px;
        color: var(--ink-dim);
        margin: 4px 0 14px;
      }
      .win-plaque-row { display: flex; gap: 10px; justify-content: center; }
      .win-plaque button { padding: 8px 16px; font-size: 14px; }

      .start-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 12, 10, 0.42);
        pointer-events: auto;
        /* Телефон на боку: высота 330–390 px, а плашка ~390 (на Android с
           Noto Serif ~410). Центр через align-items уводил её за ОБА края —
           заголовок и ссылки на политику и оферту становились недоступны.
           Теперь центрирует margin:auto у плашки: пока она помещается — ровно
           по центру, как было; не помещается — встаёт сверху и листается.
           Без вертикального padding: с ним плашка, которая помещалась
           впритык (iPhone на домашнем экране, на боку, 393 px), прижималась
           к верху и уходила низом за край. */
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .start-overlay.show { display: flex; }

      .start-panel {
        margin: auto;
        /* Как у HUD: «normal» Georgia числом. С Noto Serif (Android) плашка
           иначе выходила на ~45 px выше и в горизонтали не влезала, хотя на
           iPhone 852×393 стоит целиком. Значков вне Georgia тут нет. */
        line-height: 1.136;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: min(360px, calc(100vw - 48px));
        background: rgba(14, 26, 22, 0.88);
        border: 1px solid var(--edge);
        border-radius: 18px;
        padding: 30px 28px 22px;
        box-sizing: border-box;
        backdrop-filter: blur(6px);
        text-align: center;
      }

      .start-title { font-size: 42px; letter-spacing: 0.06em; }
      .start-sub { font-size: 13px; color: var(--ink-dim); margin-bottom: 12px; }

      .start-play {
        font-size: 17px;
        padding: 10px 46px;
        border-radius: 12px;
        background: rgba(216, 201, 160, 0.14);
        border-color: rgba(216, 201, 160, 0.38);
      }
      .start-play:hover { background: rgba(216, 201, 160, 0.24); }

      .start-shop {
        margin-top: 8px;
        font-size: 12px;
        padding: 6px 18px;
        border-radius: 10px;
        color: var(--ink-dim);
      }
      .start-shop:hover { color: var(--ink); }

      .start-account {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--edge);
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .start-account-head { font-size: 10px; letter-spacing: 0.14em; color: var(--ink-dim); text-transform: uppercase; }
      .start-user { font-size: 13px; }
      .start-providers { display: flex; gap: 8px; }
      .start-note { font-size: 11px; color: var(--ink-dim); line-height: 1.45; }
      .start-resend {
        font-size: 11px;
        padding: 3px 12px;
        color: var(--ink-dim);
        background: none;
        border-color: transparent;
      }
      .start-resend:hover { color: var(--ink); border-color: var(--edge); }
      .start-legal { font-size: 10px; color: var(--ink-dim); }
      .start-legal a { color: inherit; }
      a.start-legal:hover, .start-legal a:hover { color: var(--ink); }

      /* Кнопка-визитка вошедшего: аватар + имя, клик открывает профиль. */
      .start-me {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 16px 5px 6px;
        border-radius: 999px;
        font-size: 14px;
      }
      .start-me[hidden] { display: none; }
      .start-me-avatar,
      .acct-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(216, 201, 160, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex: none;
        font-size: 14px;
      }
      .start-me-avatar img,
      .acct-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* Профиль: та же панель, что у лавки, свои внутренности. */
      .acct-panel { width: min(400px, calc(100vw - 48px)); }
      .acct-id { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; }
      .acct-avatar { width: 56px; height: 56px; font-size: 24px; }
      .acct-name { font-size: 16px; margin-bottom: 7px; }
      .acct-avatar-btn {
        font-size: 11px;
        color: var(--ink-dim);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .acct-avatar-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.06); }
      .acct-sub {
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--ink-dim);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .acct-owned { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
      .acct-sku {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: var(--ink-dim);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 6px 11px;
      }
      .acct-sku-owned { color: var(--ink); }
      .acct-sku-owned span:last-child { color: #a9c7b2; }
      .acct-actions { display: flex; justify-content: space-between; gap: 8px; }
      .acct-signout { color: var(--ink-dim); }

      /* Плашка регистрации по почте. */
      .mail-panel { width: min(340px, calc(100vw - 48px)); }
      .mail-form { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 2px; }
      .mail-form[hidden] { display: none; }
      .mail-actions { display: flex; gap: 8px; }
      .mail-actions button { flex: 1; }
      .mail-forgot {
        align-self: center;
        font-size: 11px;
        padding: 2px 10px;
        color: var(--ink-dim);
        background: none;
        border-color: transparent;
      }
      .mail-forgot:hover { color: var(--ink); border-color: var(--edge); }
      .mail-form input {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--edge);
        border-radius: 8px;
        padding: 6px 11px;
        outline: none;
      }
      .mail-form input:focus { border-color: rgba(216, 201, 160, 0.38); }
      .mail-form input::placeholder { color: var(--ink-dim); }
      .start-note-active { color: #a9c7b2; }

      #debug {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 11;
        font: 12px/1.5 ui-monospace, monospace;
        color: #cfe3d8;
        background: rgba(10, 20, 16, 0.62);
        padding: 8px 10px;
        border-radius: 8px;
        backdrop-filter: blur(6px);
        pointer-events: none;
        white-space: pre;
        display: none;
      }
      #debug.show { display: block; }

      @media (max-width: 720px) {
        .hud-title { display: none; }
        .hud-bar { padding: 6px 8px; gap: 6px; }
        .hud-group { padding: 5px 7px; border-radius: 10px; }
        button { padding: 5px 8px; font-size: 13px; }

        /* На телефоне обе панели во всю ширину: две плашки разной длины,
           да ещё со второй строкой, прижатой вправо, читаются как сбой
           вёрстки, а не как панель. */
        .hud-group { width: 100%; box-sizing: border-box; justify-content: center; }
        /* Кнопки действий — ровная сетка в три колонки. Flex-перенос давал
           рваный хвост: четыре кнопки сверху, две в углу. Сетка держит
           одинаковую ширину независимо от длины подписи и от того, сколько
           кнопок собралось (лавка и меню зависят от хуков). */
        .hud-group-actions {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 6px;
        }
        .hud-group-actions button { width: 100%; }
      }
    </style>
  </head>
